services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tests:
    image: node:22-alpine
    profiles: ["tests"]
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      BASE: http://app:3000
    depends_on:
      app:
        condition: service_healthy
    command: ["node", "testes.mjs"]